# Global pipeline settings.

classify:
  head_chars: 4000        # classification looks at the beginning of the document

ocr:
  engine: mineru          # mineru | tesseract   (used for pages without a text layer)
  tier: flash             # MinerU tier: flash | basic (CPU); standard/advanced need a GPU in practice
  python: null            # interpreter of the MinerU venv; null = auto-detect .venv-mineru, or the current one
  cache_dir: null         # writable folder for OCR model files (null = MinerU default ~/.mineru)
  tesseract_dpi: 300
  fallback_engine: tesseract   # used when MinerU fails on a document, and for all scans after fallback_after_s
  # Time safety net, step 1 of 2 (step 2 is runtime.deadline_s):
  #   0-30 min  MinerU (more accurate, ~35 s per scan on 2 CPUs)
  #   30-40 min Tesseract (~8 s per scan on 2 CPUs) so a scan-heavy set still finishes
  #   40+ min   no OCR, no model (see runtime.deadline_s)
  # Runs that finish within 30 minutes never use it.
  fallback_after_s: 1800

# Model fallback (rules stay in charge where they are sure). OpenAI-compatible chat API.
llm:
  enabled: true
  base_url: https://api.ark-labs.cloud/api/v1     # ARK Labs (Ark Sp. z o.o., Szczecin; inference in the EU)
  model: arklabsai/Qwen3.5-4B                       # 4.66B params, open weights (Apache-2.0)
  api_key_env: ARK_API_KEY                          # read from the environment or .env
  extra_body: {reasoning_effort: none}              # Qwen: answer directly, no thinking
  max_tokens: 3000
  max_parallel: 3                                   # ARK limits concurrent requests per model
  timeout_s: 120
  retries: 4
  # Alternatives (open weights, EU endpoints):
  #   Mistral:  base_url https://api.eu.mistral.ai/v1, model ministral-14b-2512 (or ministral-3b-2512), api_key_env MISTRAL_API_KEY, extra_body {}
  #   IONOS:    base_url https://openai.inference.de-txl.ionos.com/v1, model Qwen/Qwen3.5-9B, api_key_env IONOS_API_KEY

hybrid:
  sure_margin: 2          # rules are "sure" if the best type is >= threshold + 2 AND leads the runner-up by >= 2
  classify_fallback: true # ask the model when the rules are not sure
  scan_mode: model_first  # OCR'd documents: model answer first, rules fill gaps (rules are weaker on OCR text)
  max_chars: 20000        # characters of document text sent to the model

runtime:
  workers: 4              # documents processed in parallel
  # Time safety net, step 2 of 2: if a run is still going after this many seconds, the remaining documents are
  # processed with rules only (no OCR / model calls) so the whole set finishes within the evaluator's limit
  # (45 min). Runs shorter than this are not affected at all.
  deadline_s: 2400
